server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: blog-system
  profiles:
    active: dev

  # ========== 数据源 ==========
  # 开发模式：H2 内存数据库（无需安装 MySQL，启动即用）
  # 生产模式：取消下方注释，切换为 MySQL
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:blog_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:

  # ========== 自动初始化数据库（开发模式）==========
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
      encoding: UTF-8

  # ========== H2 控制台（浏览器查看数据库）==========
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # ========== Redis ==========
  # 开发模式：如无 Redis，可注释掉，使用本地缓存替代
  data:
    redis:
      host: localhost
      port: 6379
      password:        # 如无密码留空
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0

# ========== MyBatis-Plus ==========
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.blog.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # dev 环境打印 SQL
  global-config:
    db-config:
      id-type: auto          # 主键自增
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ========== JWT 配置 ==========
jwt:
  # 密钥 (HS256 要求 >= 32 字节，生产环境请替换为随机密钥)
  secret: CHANGE_ME_CHANGE_ME_CHANGE_ME_SECRET_KEY_12345
  # 过期时间 (秒) - 24小时
  expire: 86400
  # Header 名称
  header: Authorization
  # Token 前缀
  prefix: "Bearer "

# ========== Knife4j (Swagger) ==========
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
  setting:
    language: zh_cn

# ========== 日志 ==========
logging:
  level:
    com.blog: debug
    com.blog.mapper: debug
